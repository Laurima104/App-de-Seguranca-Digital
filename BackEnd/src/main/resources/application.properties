# MySQL local. Defina DB_URL, DB_USERNAME e DB_PASSWORD no ambiente do processo.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cyberseguranca?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Em desenvolvimento, cria/atualiza a tabela a partir das entidades JPA.
# Em produção, use migrações versionadas e ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8080}
